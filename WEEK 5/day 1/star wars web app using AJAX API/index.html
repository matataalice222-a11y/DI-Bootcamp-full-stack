<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars API App</title>
    <!-- FontAwesome for loading icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <h1>Star Wars Character Generator</h1>
        
        <!-- Character Display Box -->
        <div id="character-info">
            <h2 id="name"></h2>
            <p><strong>Height:</strong> <span id="height"></span></p>
            <p><strong>Gender:</strong> <span id="gender"></span></p>
            <p><strong>Birth Year:</strong> <span id="birth-year"></span></p>
            <p><strong>Home World:</strong> <span id="homeworld"></span></p>
        </div>

        <!-- Loading Message / Spinner -->
        <div id="loading" class="hidden">
            <i class="fas fa-spinner fa-spin fa-3x"></i>
            <p>Loading...</p>
        </div>

        <!-- Error Message Box -->
        <div id="error-message" class="hidden">
            <p>⚠️ Oh no! That person couldn't be retrieved.</p>
        </div>

        <!-- Action Button -->
        <button id="btn">Find Someone</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
